name: build-and-deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalog and plugin
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I build/build.py
      - name: Landing page
        run: |
          cat > dist/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Lampa Hub</title>
          <body style="font-family:sans-serif;max-width:40em;margin:2em auto">
          <h1>Lampa Hub</h1>
          <p>Plugin URL: <code>https://${GITHUB_REPOSITORY_OWNER}.github.io/lampa-hub/lampa-hub.js</code></p>
          <p><a href="catalog.json">catalog.json</a></p>
          </body>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
